name: install-llvm
description: Download and install LLVM for Windows
runs:
  using: composite
  steps:
    - name: Cache LLVM installer
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/llvm-temp
        key: llvm-23.1.6-win64

    - name: Download and install LLVM
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'

        $Version = '23.1.6'
        $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${Version}/LLVM-${Version}-win64.msi"

        $llvmTemp = Join-Path $env:RUNNER_TEMP 'llvm-temp'
        $install = Join-Path $llvmTemp 'llvm.msi'

        # download
        Write-Host "Downloading LLVM..."
        New-Item -ItemType Directory -Force -Path "$llvmTemp" | Out-Null
        if (-not (Test-Path $install)) {
          (New-Object System.Net.WebClient).DownloadFile("$url", "$install")
        } else {
          Write-Host "LLVM installer already cached."
        }

        # install
        Write-Host "Installing LLVM..."
        # An administrative installation only extracts the files, so the runner toolchain stays untouched.
        $target = Join-Path $env:RUNNER_TEMP 'hostforge-llvm-msi'
        $log = Join-Path $env:RUNNER_TEMP 'llvm-msi.log'
        $proc = Start-Process -FilePath msiexec.exe -ArgumentList @('/a', "`"$install`"", '/qn', "TARGETDIR=`"$target`"", '/l*v', "`"$log`"") -Wait -PassThru
        if ($proc.ExitCode -ne 0) {
          Get-Content $log -Tail 50
          throw "LLVM install failed with exit code $($proc.ExitCode)"
        }
        $destination = Join-Path $target 'LLVM'
        & "$destination\bin\clang-cl.exe" --version
        if ($LASTEXITCODE -ne 0) { throw 'clang-cl is unavailable after installation.' }
        "LLVM_HOME=$destination" >> $env:GITHUB_ENV
        "$destination\bin" >> $env:GITHUB_PATH
