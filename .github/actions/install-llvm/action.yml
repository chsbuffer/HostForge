name: install-llvm
description: Download and install LLVM for Windows
runs:
  using: composite
  steps:
    - name: Cache LLVM installer
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/llvm-temp
        key: llvm-21.1.8-win64

    - name: Download and install LLVM
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'

        $Version = '21.1.8'
        $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${Version}/LLVM-${Version}-win64.exe"

        $llvmTemp = Join-Path $env:RUNNER_TEMP 'llvm-temp'
        $install = Join-Path $llvmTemp 'llvm.exe'

        # download
        Write-Host "Downloading LLVM..."
        New-Item -ItemType Directory -Force -Path "$llvmTemp" | Out-Null
        if (-not (Test-Path $install)) {
          (New-Object System.Net.WebClient).DownloadFile("$url", "$install")
        } else {
          Write-Host "LLVM installer already cached."
        }

        # install
        Write-Host "Installing LLVM..."
        # Install in a private location without uninstalling the runner toolchain.
        $destination = Join-Path $env:RUNNER_TEMP 'hostforge-llvm'
        $proc = Start-Process -FilePath $install -ArgumentList @('/S', "/D=$destination") -WindowStyle Hidden -Wait -PassThru
        if ($proc.ExitCode -ne 0) {
          throw "LLVM install failed with exit code $($proc.ExitCode)"
        }
        & "$destination\bin\clang-cl.exe" --version
        if ($LASTEXITCODE -ne 0) { throw 'clang-cl is unavailable after installation.' }
        "LLVM_HOME=$destination" >> $env:GITHUB_ENV
        "$destination\bin" >> $env:GITHUB_PATH
