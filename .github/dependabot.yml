# GitHub Actions versions only; the pinned build inputs are tracked by the upstream workflow.
# "/" covers .github/workflows (and a root action.yml); the composite actions under .github/actions are
# listed separately.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: build
      include: scope
