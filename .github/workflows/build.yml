        run: task pack-avalonia SKIASHARP_VERSION=${{ env.SKIASHARP_VERSION }}

      - name: Upload nuget packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-avalonia-apphost-skia4
          path: artifacts\packages\Release
          if-no-files-found: error

  publish-nuget:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - pack-all
      - test-skia-linux-cross
      - test-skia-windows-arm64
      - test-all
      - test-all-windows
      - test-all-linux
      - pack-avalonia-apphost
      - pack-avalonia-apphost-skia4
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Download native packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-native-all
          path: artifacts/packages/Release
      - name: Download Avalonia AppHost packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-avalonia-apphost
          path: artifacts/packages/Release
      - name: Download Skia 4 Avalonia AppHost packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-avalonia-apphost-skia4
          path: artifacts/packages/Release
      # Request the short-lived key only after all packages are downloaded.
      - name: NuGet login with Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/packages/Release/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # Runs only when every needed job succeeded, so "Re-run failed jobs" still finds the artifacts. On pull
  # requests publish-nuget is always skipped, so the other needed jobs are checked one by one: a cancelled
  # job (e.g. a runner that was never acquired) only skips its dependents, which failure() does not report.
  # Fork pull requests get a read-only token, so they keep their artifacts until retention expires.
  cleanup-all:
    if: >-
      ${{ !cancelled() && !failure() && (
      (github.event_name == 'push' && needs.publish-nuget.result == 'success') ||
      (github.event_name == 'pull_request' && needs.publish-nuget.result == 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.test-skia-linux-cross.result == 'success' && needs.test-skia-windows-arm64.result == 'success' &&
      needs.test-all.result == 'success' && needs.build-skia-macos.result == 'success' &&
      needs.test-all-windows.result == 'success' && needs.test-all-linux.result == 'success' &&
      needs.test-avalonia-apphost-linux-musl.result == 'success' &&
      needs.test-avalonia-apphost-skia4-linux-musl.result == 'success' &&
      needs.pack-avalonia-apphost.result == 'success' && needs.pack-avalonia-apphost-skia4.result == 'success')) }}
    runs-on: ubuntu-24.04
    needs:
      - publish-nuget
      - test-skia-linux-cross
      - test-skia-windows-arm64
      - test-all
      - build-skia-macos
      - test-all-windows
      - test-all-linux
      - test-avalonia-apphost-linux-musl
      - test-avalonia-apphost-skia4-linux-musl
      - pack-avalonia-apphost
      - pack-avalonia-apphost-skia4
    permissions:
      actions: write
    steps:
      - name: Delete packaged build artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          # The artifact service can answer a delete with 404 for an artifact it has just listed. The artifacts
          # expire after their retention days anyway, so a failed delete is reported without failing the build.
          failOnError: false
          name: |
            native-skia-*
            native-rootfs-*
            native-angle-*
            avalonia-host-*
            nuget-native-skia-*
            nuget-native-avalonianative-*
