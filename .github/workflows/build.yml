    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan-all.outputs.hostlibs-versions) }}
        target: ${{ fromJSON(needs.plan-all.outputs.hostlibs-linux-targets) }}
    env:
      HOSTLIBS_VERSION: ${{ matrix.version }}
