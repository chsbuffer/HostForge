  linux-sysroot:
    if: github.event_name == 'push' || (inputs.components == 'all' && (inputs.rid == '' || inputs.rid == 'all'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Prepare the shared bionic cross rootfs
        uses: ./.github/actions/target-rootfs

  linux-hostlibs:
    runs-on: ubuntu-latest
    env:
      CONAN_HOME: ${{ github.workspace }}/build/conan
    needs:
      - linux-sysroot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Restore Linux sysroot
        id: restore_sysroot
        uses: ./.github/actions/target-rootfs

      - uses: ./.github/actions/native-cache
        id: cache_hostlibs
        with:
          component: hostlibs
          version: 10.0.12
          rid: linux-x64
          path: artifacts/hostlibs
          mode: ${{ inputs.cache_mode || 'normal' }}
          compiler-cache-size: 512M
          compiler: sccache

      - name: Build and deploy HostLibs
        if: steps.cache_hostlibs.outputs.cache-hit != 'true'
        run: python scripts/build-with-cache.py task build-hostlibs SYSROOT="${{ steps.restore_sysroot.outputs.sysroot-path }}" JOBS=4

      - name: Upload hostlibs artifact
        uses: actions/upload-artifact@v6
        with:
          name: hostlibs-default-linux-x64
          path: artifacts/hostlibs
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('build/cache-stats/build.json') != ''
        with:
          name: cache-stats-hostlibs-10.0.12-linux-x64
          overwrite: true
          path: build/cache-stats
          retention-days: 7

