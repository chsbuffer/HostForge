      TARGET_ARCH: ${{ matrix.target.arch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - uses: ./.github/actions/native-cache
        id: cache_hostlibs
        with:
          component: hostlibs
          version: ${{ matrix.version }}
          rid: ${{ matrix.target.rid }}
          path: artifacts/hostlibs
          compiler-cache-size: 512M
          compiler: sccache

      - name: Prepare the upstream build container
        if: steps.cache_hostlibs.outputs.cache-hit != 'true'
        uses: ./.github/actions/upstream-container
        with:
          stage: build
          rid: ${{ matrix.target.rid }}
          version: ${{ matrix.version }}
          tag: hostforge-hostlibs

      - name: Build and deploy HostLibs
        if: steps.cache_hostlibs.outputs.cache-hit != 'true'
        run: >-
          docker run --rm -v "$PWD:/work"
          -e HOSTFORGE_COMPILER_CACHE=/work/build/tools/sccache/sccache
          -e SCCACHE_DIR=/work/build/compiler-cache -e SCCACHE_CACHE_SIZE -e SCCACHE_DIRECT=false
          hostforge-hostlibs python3 scripts/build-with-cache.py task build-hostlibs RID="$TARGET_RID" HOSTLIBS_VERSION="$HOSTLIBS_VERSION" SYSROOT="/crossrootfs/$TARGET_ARCH" JOBS=4

      - name: Restore ownership of container build outputs
        if: steps.cache_hostlibs.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" artifacts build

      - name: Upload hostlibs artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-hostlib-default-${{ matrix.version }}-${{ matrix.target.rid }}
