          path: artifacts/skiasharp

      # The Static AppHost matrix links the HostLibs, so it runs in the container of the newest runtime, like
      # link-avalonia-apphost-linux.
      - name: Prepare the upstream container
        uses: ./.github/actions/upstream-container
        with:
          stage: build
          rid: linux-x64
          tag: hostforge-static-apphost

      # Without an init process to reap the build servers that the matrix's builds leave behind, dotnet test does
      # not exit after the tests.
      - name: Run the Static AppHost matrix
        run: >-
