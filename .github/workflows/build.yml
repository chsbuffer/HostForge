name: build

on:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Keep the job graph below in sync with the Mermaid workflow diagram in DEVELOPMENT.md.
jobs:
  build-avalonianative-macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel
    env:
      CONAN_HOME: ${{ github.workspace }}/build/conan
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v10.0.0
      - uses: ./.github/actions/install-task
      - name: Verify Xcode and host architecture
        env:
          TARGET_RID: ${{ matrix.rid }}
        run: |
          xcodebuild -version
          xcrun --show-sdk-version
          uname -sm
          system_profiler SPDisplaysDataType
          if [[ "$TARGET_RID" == osx-arm64 ]]; then
            test "$(uname -m)" = arm64
          else
            test "$(uname -m)" = x86_64
          fi
      - uses: ./.github/actions/native-cache
        id: native-cache
        with:
          component: avalonianative
          version: 12.1.3
          rid: ${{ matrix.rid }}
          path: artifacts/avalonianative/12.1.3/${{ matrix.rid }}
          compiler-cache-size: 32M
          compiler: ccache
      - name: Build AvaloniaNative from source
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python scripts/build-with-cache.py task build-avalonianative RID=${{ matrix.rid }}
      - name: Pack AvaloniaNative
        id: pack
        run: task pack-avalonianative RID=${{ matrix.rid }}
      - name: Enforce NuGet size limit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for package in Path('artifacts/packages/Release').glob('ChsBuffer.Avalonia.Native.Static.*.nupkg'):
              size = package.stat().st_size
              print(f'{package.name}: {size} bytes')
              assert size < 250_000_000, package
          PY
      - name: Publish, inspect linkage and run AvaloniaNative tests
        run: task test-avalonianative
      - uses: actions/upload-artifact@v6
        if: always() && steps.pack.outcome == 'success'
        with:
          compression-level: 0
          name: nuget-native-avalonianative-12.1.3-${{ matrix.rid }}
          path: artifacts/packages/Release/ChsBuffer.Avalonia.Native.Static.${{ matrix.rid }}.12.1.3.nupkg
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  plan-all:
    runs-on: ubuntu-24.04
    outputs:
      versions: >-
        [
          "3.119.4",
          "4.153.1"
        ]
      macos: >-
        [
          {"rid": "osx-x64", "runner": "macos-15-intel"},
          {"rid": "osx-arm64", "runner": "macos-15"}
        ]
      windows: >-
        [
          "win-x64",
          "win-arm64"
        ]
      targets: >-
        [
          {"rid": "win-x64", "runner": "windows-2025-vs2026"},
          {"rid": "win-arm64", "runner": "windows-11-arm"},
          {"rid": "linux-x64", "runner": "ubuntu-24.04"},
          {"rid": "linux-arm64", "runner": "ubuntu-24.04-arm"},
          {"rid": "linux-musl-x64", "runner": "ubuntu-24.04"},
          {"rid": "linux-musl-arm64", "runner": "ubuntu-24.04-arm"},
          {"rid": "osx-x64", "runner": "macos-15-intel"},
          {"rid": "osx-arm64", "runner": "macos-15"}
        ]
      linux-cross-targets: >-
        [
          {"rid": "linux-arm64", "arch": "arm64", "runner": "ubuntu-24.04-arm"},
          {"rid": "linux-musl-x64", "arch": "x64", "runner": "ubuntu-24.04"},
          {"rid": "linux-musl-arm64", "arch": "arm64", "runner": "ubuntu-24.04-arm"}
        ]
    steps:
      - uses: actions/checkout@v6
      - run: python -m unittest discover -s tests/native -v

  build-angle-windows:
    needs: plan-all
    runs-on: windows-2025-vs2026
    env:
      CONAN_HOME: ${{ github.workspace }}/build/conan
    strategy:
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: arm64
            rid: win-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - uses: ./.github/actions/native-cache
        id: cache_angle
        with:
          component: angle
          version: 2.1.27548.20260419
          rid: ${{ matrix.rid }}
          path: artifacts/angle
          compiler-cache-size: 64M
          compiler: sccache

      - name: Install uv
        if: steps.cache_angle.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.0.0

      - name: Install Task
        if: steps.cache_angle.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-task

      - name: Install depot_tools
        if: steps.cache_angle.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$env:RUNNER_TEMP\depot_tools"
          "$env:RUNNER_TEMP\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build and deploy ANGLE
        shell: powershell
        if: steps.cache_angle.outputs.cache-hit != 'true'
        run: python scripts/build-with-cache.py task build-angle ARCH=${{ matrix.arch }} JOBS=4

      - name: Upload ANGLE artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-angle-${{ matrix.rid }}
          path: artifacts\angle
          if-no-files-found: error

  build-skia-windows:
    needs: plan-all
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan-all.outputs.versions) }}
        rid: ${{ fromJSON(needs.plan-all.outputs.windows) }}
    env:
      CONAN_HOME: ${{ github.workspace }}/build/conan
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/native-cache
        id: native-cache
        with:
          component: skiasharp
          version: ${{ matrix.version }}
          rid: ${{ matrix.rid }}
          path: artifacts/skiasharp/${{ matrix.version }}/${{ matrix.rid }}
          compiler-cache-size: 128M
          compiler: sccache
      - uses: astral-sh/setup-uv@v10.0.0
        if: steps.native-cache.outputs.cache-hit != 'true'
      - uses: ./.github/actions/install-task
        if: steps.native-cache.outputs.cache-hit != 'true'
      - uses: ./.github/actions/install-llvm
        if: steps.native-cache.outputs.cache-hit != 'true'
      - name: Build static SkiaSharp and HarfBuzzSharp
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python scripts/build-with-cache.py task build-skiasharp RID=${{ matrix.rid }} SKIASHARP_VERSION=${{ matrix.version }} JOBS=4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Pack RID package
        run: dotnet pack src/package-skiasharp-static/SkiaSharp.Static.csproj -c Release -p:AvaloniaHostRid=${{ matrix.rid }} -p:SkiaSharpVersion=${{ matrix.version }}
      - name: Publish and run NativeAOT, guards and non-AOT activation
        if: matrix.rid == 'win-x64'
        env:
          HOSTFORGE_SKIA_VERSION: ${{ matrix.version }}
          HOSTFORGE_CHECK_ANGLE: 'false'
        run: dotnet test --project tests/HostForge.NativeAot.Tests/HostForge.NativeAot.Tests.csproj -c Release
      - uses: actions/upload-artifact@v6
        with:
          compression-level: 0
          name: nuget-native-skia-${{ matrix.version }}-${{ matrix.rid }}
          path: artifacts/packages/Release/*.nupkg
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: native-skia-${{ matrix.version }}-${{ matrix.rid }}
          path: artifacts/skiasharp
          if-no-files-found: error
          retention-days: 7

  test-skia-windows-arm64:
    needs: [plan-all, build-skia-windows]
    if: ${{ !cancelled() && needs.plan-all.result == 'success' && contains(fromJSON('["success","failure"]'), needs.build-skia-windows.result) }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan-all.outputs.versions) }}
    env:
      HOSTFORGE_NATIVE_RID: win-arm64
      HOSTFORGE_SKIA_VERSION: ${{ matrix.version }}
      HOSTFORGE_CHECK_ANGLE: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8.0.1
        with:
          name: nuget-native-skia-${{ matrix.version }}-win-arm64
          path: artifacts/packages/Release
      - name: Publish and execute ARM64 NativeAOT
        run: dotnet test --project tests/HostForge.NativeAot.Tests -c Release

  build-skia-linux:
    needs: plan-all
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan-all.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/native-cache
        id: native-cache
        with:
          component: skiasharp
          version: ${{ matrix.version }}
          rid: linux-x64
          path: artifacts/skiasharp/${{ matrix.version }}/linux-x64
          compiler-cache-size: 64M
          compiler: sccache
      - uses: actions/cache@v5
        id: rootfs-cache
        with:
          path: artifacts/rootfs/target.tar.gz
          key: ${{ steps.native-cache.outputs.rootfs-key }}
      - name: Prepare pinned LLVM and target sysroot
        if: steps.native-cache.outputs.cache-hit != 'true' || steps.rootfs-cache.outputs.cache-hit != 'true'
        run: docker build -f native/skiasharp/linux-x64.Dockerfile -t hostforge-skia .
      - name: Build static SkiaSharp and HarfBuzzSharp
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          SKIA_VERSION: ${{ matrix.version }}
        run: >-
          docker run --rm -v "$PWD:/work"
          -e HOSTFORGE_COMPILER_CACHE=/work/build/tools/sccache/sccache
          -e SCCACHE_DIR=/work/build/compiler-cache -e SCCACHE_CACHE_SIZE -e SCCACHE_DIRECT=false
          hostforge-skia python3 scripts/build-with-cache.py task build-skiasharp RID=linux-x64 SKIASHARP_VERSION="$SKIA_VERSION" SYSROOT=/crossrootfs/x64 JOBS=4
      - name: Export the target sysroot
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p artifacts/rootfs
          docker run --rm hostforge-skia tar czf - -C /crossrootfs/x64 . > artifacts/rootfs/target.tar.gz
      - name: Restore target sysroot for NativeAOT
        run: |
          sudo mkdir -p build/rootfs/x64
          sudo chown -R "$(id -u):$(id -g)" build artifacts
          tar xzf artifacts/rootfs/target.tar.gz -C build/rootfs/x64
          sudo apt-get update
          sudo apt-get install -y clang lld fontconfig fonts-dejavu-core
      - uses: actions/upload-artifact@v6
        with:
          name: native-rootfs-${{ matrix.version }}-linux-x64
          path: artifacts/rootfs/target.tar.gz
          compression-level: 0
          retention-days: 3
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Pack RID package
        run: dotnet pack src/package-skiasharp-static/SkiaSharp.Static.csproj -c Release -p:AvaloniaHostRid=linux-x64 -p:SkiaSharpVersion=${{ matrix.version }}
      - name: Publish, run and audit NativeAOT against the target sysroot
        env:
          HOSTFORGE_SKIA_VERSION: ${{ matrix.version }}
          HOSTFORGE_CHECK_ANGLE: 'false'
          ROOTFS_DIR: ${{ github.workspace }}/build/rootfs/x64
        run: dotnet test --project tests/HostForge.NativeAot.Tests/HostForge.NativeAot.Tests.csproj -c Release
      - uses: actions/upload-artifact@v6
        with:
          compression-level: 0
          name: nuget-native-skia-${{ matrix.version }}-linux-x64
          path: artifacts/packages/Release/*.nupkg
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: native-skia-${{ matrix.version }}-linux-x64
          path: artifacts/skiasharp
          if-no-files-found: error
          retention-days: 7

  build-skia-linux-cross:
    needs: plan-all
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan-all.outputs.versions) }}
        target: ${{ fromJSON(needs.plan-all.outputs.linux-cross-targets) }}
    env:
      TARGET_RID: ${{ matrix.target.rid }}
      TARGET_ARCH: ${{ matrix.target.arch }}
      SKIA_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/native-cache
        id: native-cache
        with:
          component: skiasharp
          version: ${{ matrix.version }}
          rid: ${{ matrix.target.rid }}
          path: artifacts/skiasharp/${{ matrix.version }}/${{ matrix.target.rid }}
          compiler-cache-size: 64M
          compiler: sccache
      - uses: actions/cache@v5
        id: rootfs-cache
        with:
          path: artifacts/rootfs/target.tar.gz
          key: ${{ steps.native-cache.outputs.rootfs-key }}
      - name: Prepare pinned amd64 cross compiler and target sysroot
        if: steps.native-cache.outputs.cache-hit != 'true' || steps.rootfs-cache.outputs.cache-hit != 'true'
        run: docker build -f "native/skiasharp/$TARGET_RID.Dockerfile" -t hostforge-skia-cross .
      - name: Cross compile static SkiaSharp and HarfBuzzSharp
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: >-
          docker run --rm -v "$PWD:/work"
          -e HOSTFORGE_COMPILER_CACHE=/work/build/tools/sccache/sccache
          -e SCCACHE_DIR=/work/build/compiler-cache -e SCCACHE_CACHE_SIZE -e SCCACHE_DIRECT=false
          hostforge-skia-cross python3 scripts/build-with-cache.py task build-skiasharp RID="$TARGET_RID" SKIASHARP_VERSION="$SKIA_VERSION" SYSROOT="/crossrootfs/$TARGET_ARCH" JOBS=4
      - name: Export the matching sysroot for the native AOT runner
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" artifacts
          mkdir -p artifacts/rootfs
          docker run --rm hostforge-skia-cross tar czf - -C "/crossrootfs/$TARGET_ARCH" . > artifacts/rootfs/target.tar.gz
          sudo chown -R "$(id -u):$(id -g)" artifacts
      - name: Restore ownership of container build outputs
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" artifacts build
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Pack RID package
        run: dotnet pack src/package-skiasharp-static/SkiaSharp.Static.csproj -c Release -p:AvaloniaHostRid="$TARGET_RID" -p:SkiaSharpVersion="$SKIA_VERSION"
      - uses: actions/upload-artifact@v6
        with:
          compression-level: 0
          name: nuget-native-skia-${{ matrix.version }}-${{ matrix.target.rid }}
          path: artifacts/packages/Release/*.nupkg
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: native-rootfs-${{ matrix.version }}-${{ matrix.target.rid }}
          path: artifacts/rootfs/target.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v6
        with:
          name: native-skia-${{ matrix.version }}-${{ matrix.target.rid }}
          path: artifacts/skiasharp
          if-no-files-found: error
          retention-days: 7

  test-skia-linux-cross:
    needs: [plan-all, build-skia-linux-cross]
    if: ${{ !cancelled() && needs.plan-all.result == 'success' && contains(fromJSON('["success","failure"]'), needs.build-skia-linux-cross.result) }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan-all.outputs.versions) }}
        target: ${{ fromJSON(needs.plan-all.outputs.linux-cross-targets) }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    env:
      HOSTFORGE_NATIVE_RID: ${{ matrix.target.rid }}
      HOSTFORGE_SKIA_VERSION: ${{ matrix.version }}
      HOSTFORGE_CHECK_ANGLE: 'false'
      ROOTFS_DIR: ${{ github.workspace }}/build/rootfs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8.0.1
        with:
          name: nuget-native-skia-${{ matrix.version }}-${{ matrix.target.rid }}
          path: artifacts/packages/Release
      - uses: actions/download-artifact@v8.0.1
        with:
          name: native-rootfs-${{ matrix.version }}-${{ matrix.target.rid }}
          path: artifacts/rootfs
      - name: Restore target sysroot
        run: |
          mkdir -p "$ROOTFS_DIR"
          tar xzf artifacts/rootfs/target.tar.gz -C "$ROOTFS_DIR"
      - uses: actions/setup-dotnet@v5
        if: matrix.target.rid == 'linux-arm64'
        with:
          dotnet-version: 10.0.x
      - name: Publish, run and audit glibc NativeAOT
        if: matrix.target.rid == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils fontconfig fonts-dejavu-core
          dotnet test --project tests/HostForge.NativeAot.Tests/HostForge.NativeAot.Tests.csproj -c Release
      - name: Publish, run and audit musl NativeAOT in native Alpine
        if: startsWith(matrix.target.rid, 'linux-musl-')
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            -e ROOTFS_DIR -e HOSTFORGE_NATIVE_RID -e HOSTFORGE_SKIA_VERSION -e HOSTFORGE_CHECK_ANGLE \
            mcr.microsoft.com/dotnet/sdk@sha256:3f9c03432d664163a90d20e3ed0a3784d0aa82c1b9cbd1a7dd4609fede95669e \
            sh -eu -c 'apk add --no-cache clang lld llvm binutils fontconfig font-dejavu && dotnet test --project tests/HostForge.NativeAot.Tests/HostForge.NativeAot.Tests.csproj -c Release'

  build-skia-macos:
    needs: plan-all
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan-all.outputs.versions) }}
        target: ${{ fromJSON(needs.plan-all.outputs.macos) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      CONAN_HOME: ${{ github.workspace }}/build/conan
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/native-cache
        id: native-cache
        with:
          component: skiasharp
          version: ${{ matrix.version }}
          rid: ${{ matrix.target.rid }}
          path: artifacts/skiasharp/${{ matrix.version }}/${{ matrix.target.rid }}
          compiler-cache-size: 64M
          compiler: sccache
      - uses: astral-sh/setup-uv@v10.0.0
        if: steps.native-cache.outputs.cache-hit != 'true'
      - uses: ./.github/actions/install-task
        if: steps.native-cache.outputs.cache-hit != 'true'
      - name: Build static SkiaSharp and HarfBuzzSharp with GN
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python scripts/build-with-cache.py task build-skiasharp RID=${{ matrix.target.rid }} SKIASHARP_VERSION=${{ matrix.version }} JOBS=4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Pack RID package
        run: dotnet pack src/package-skiasharp-static/SkiaSharp.Static.csproj -c Release -p:AvaloniaHostRid=${{ matrix.target.rid }} -p:SkiaSharpVersion=${{ matrix.version }}
      - name: Publish, run and audit Mach-O NativeAOT
        env:
          HOSTFORGE_NATIVE_RID: ${{ matrix.target.rid }}
          HOSTFORGE_SKIA_VERSION: ${{ matrix.version }}
          HOSTFORGE_CHECK_ANGLE: 'false'
        run: dotnet test --project tests/HostForge.NativeAot.Tests/HostForge.NativeAot.Tests.csproj -c Release
      - uses: actions/upload-artifact@v6
        with:
          compression-level: 0
          name: nuget-native-skia-${{ matrix.version }}-${{ matrix.target.rid }}
          path: artifacts/packages/Release/*.nupkg
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: native-skia-${{ matrix.version }}-${{ matrix.target.rid }}
          path: artifacts/skiasharp
          if-no-files-found: error
          retention-days: 7

  pack-all:
    needs: [plan-all, build-skia-windows, build-skia-linux, build-skia-linux-cross, build-skia-macos, build-angle-windows, build-avalonianative-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: ./.github/actions/install-task
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: nuget-native-skia-*
          merge-multiple: true
          path: artifacts/packages/Release
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: nuget-native-avalonianative-*
          merge-multiple: true
          path: artifacts/packages/Release
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-angle-*
          merge-multiple: true
          path: artifacts/angle
      - name: Pack complete meta packages and enforce the NuGet size limit
        env:
          VERSIONS: ${{ needs.plan-all.outputs.versions }}
        run: |
          task pack-angle-static RID=win-x64
          task pack-angle-static RID=win-arm64
          for version in $(jq -r '.[]' <<< "$VERSIONS"); do
            task pack-graphics-meta COMPONENT=SkiaSharp SKIASHARP_VERSION="$version"
          done
          task pack-graphics-meta COMPONENT=Angle
          task pack-graphics-meta COMPONENT=Avalonia.Native
          python3 - <<'PY'
          import hashlib, json, pathlib
          records = []
          for package in sorted(pathlib.Path("artifacts/packages/Release").glob("*.nupkg")):
              size = package.stat().st_size
              assert size < 250_000_000, (package, size)
              records.append({"package": package.name, "bytes": size, "sha256": hashlib.sha256(package.read_bytes()).hexdigest()})
          pathlib.Path("artifacts/packages/Release/package-sizes.json").write_text(json.dumps(records, indent=2))
          PY
      - uses: actions/upload-artifact@v6
        with:
          compression-level: 0
          name: nuget-native-all
          path: artifacts/packages/Release/*
          if-no-files-found: error
          retention-days: 7

  test-all:
    needs: [plan-all, pack-all]
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan-all.outputs.versions) }}
        target: ${{ fromJSON(needs.plan-all.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 40
    env:
      HOSTFORGE_NATIVE_RID: ${{ matrix.target.rid }}
      HOSTFORGE_SKIA_VERSION: ${{ matrix.version }}
      HOSTFORGE_TEST_META: 'true'
      HOSTFORGE_CHECK_ANGLE: ${{ startsWith(matrix.target.rid, 'win-') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        if: ${{ !startsWith(matrix.target.rid, 'linux-musl-') }}
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8.0.1
        with:
          name: nuget-native-all
          path: artifacts/packages/Release
      - uses: actions/download-artifact@v8.0.1
        if: runner.os == 'Linux'
        with:
          name: native-rootfs-${{ matrix.version }}-${{ matrix.target.rid }}
          path: artifacts/rootfs
      - name: Restore the target Linux sysroot
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/rootfs
          tar xzf artifacts/rootfs/target.tar.gz -C build/rootfs
          echo "ROOTFS_DIR=$GITHUB_WORKSPACE/build/rootfs" >> "$GITHUB_ENV"
      - name: Install glibc link and runtime dependencies
        if: runner.os == 'Linux' && !startsWith(matrix.target.rid, 'linux-musl-')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils fontconfig fonts-dejavu-core
      - name: Build without RID and publish and run both RID and three-meta consumers
        if: ${{ !startsWith(matrix.target.rid, 'linux-musl-') }}
        run: dotnet test --project tests/HostForge.NativeAot.Tests -c Release
      - name: Build and publish the three-meta consumer in native Alpine
        if: startsWith(matrix.target.rid, 'linux-musl-')
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            -e ROOTFS_DIR -e HOSTFORGE_NATIVE_RID -e HOSTFORGE_SKIA_VERSION -e HOSTFORGE_CHECK_ANGLE -e HOSTFORGE_TEST_META \
            mcr.microsoft.com/dotnet/sdk@sha256:3f9c03432d664163a90d20e3ed0a3784d0aa82c1b9cbd1a7dd4609fede95669e \
            sh -eu -c 'apk add --no-cache clang lld llvm binutils fontconfig font-dejavu && dotnet test --project tests/HostForge.NativeAot.Tests -c Release'
      - name: Prepare Mesa software drivers for static Avalonia
        if: matrix.target.rid == 'linux-x64'
        run: |
          sudo apt-get install -y libfontconfig1-dev libx11-6 libice6 libsm6 libxcursor1 libxrandr2 libxi6 libxrender1 libxext6 libglib2.0-0t64 xvfb xauth mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri libglx-mesa0
          for manifest in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            test -f "$manifest"
            echo "VK_DRIVER_FILES=$manifest" >> "$GITHUB_ENV"
            echo "VK_ICD_FILENAMES=$manifest" >> "$GITHUB_ENV"
          done
      - name: Prove static Skia Vulkan, EGL and GLX rendering
        if: matrix.target.rid == 'linux-x64'
        env:
          HOSTFORGE_SMOKE_REQUIRED: '1'
          HOSTFORGE_SMOKE_SKIA_VERSION: ${{ matrix.version }}
          HOSTFORGE_SMOKE_MODES: Vulkan,Egl,Glx
          HOSTFORGE_SMOKE_VULKAN_VERSION: 1.3.0
          LIBGL_ALWAYS_SOFTWARE: '1'
          SmokeUseStaticSkia: 'true'
          SmokePackageSource: ${{ github.workspace }}/artifacts/packages/Release
        run: xvfb-run -a dotnet test --project tests/HostForge.NativeAot.Tests -c Release --treenode-filter '/*/*/AvaloniaSmokeTests/*'
      - name: Prove static Skia and ANGLE rendering with WARP
        if: runner.os == 'Windows'
        continue-on-error: ${{ matrix.target.rid == 'win-arm64' }}
        env:
          HOSTFORGE_SMOKE_REQUIRED: '1'
          HOSTFORGE_SMOKE_SKIA_VERSION: ${{ matrix.version }}
          HOSTFORGE_SMOKE_MODES: AngleEgl
          HOSTFORGE_SMOKE_ANGLE_ADAPTER: Microsoft Basic Render Driver
          SmokeUseStaticSkia: 'true'
          SmokeUseStaticAngle: 'true'
          SmokePackageSource: ${{ github.workspace }}/artifacts/packages/Release
        run: dotnet test --project tests/HostForge.NativeAot.Tests -c Release --treenode-filter '/*/*/AvaloniaSmokeTests/*'
      - name: Select Metal when the macOS runner exposes a device
        if: runner.os == 'macOS'
        run: |
          mkdir -p build
          cat > build/metal-device.m <<'OBJC'
          #import <Metal/Metal.h>
          int main(void) { return MTLCreateSystemDefaultDevice() ? 0 : 1; }
          OBJC
          xcrun clang -fobjc-arc build/metal-device.m -framework Metal -framework Foundation -o build/metal-device
          if build/metal-device; then
            echo 'HOSTFORGE_SMOKE_MODES=Metal' >> "$GITHUB_ENV"
          else
            echo 'HOSTFORGE_SMOKE_MODES=Software' >> "$GITHUB_ENV"
            echo 'The hosted macOS runner exposes no Metal device; exercising Software.' | tee build/metal-availability.log
          fi
      - name: Draw with static Skia and static AvaloniaNative
        if: runner.os == 'macOS'
        env:
          HOSTFORGE_SMOKE_REQUIRED: '1'
          HOSTFORGE_SMOKE_SKIA_VERSION: ${{ matrix.version }}
          SmokeUseStaticSkia: 'true'
          SmokeUseStaticAvaloniaNative: 'true'
          SmokePackageSource: ${{ github.workspace }}/artifacts/packages/Release
        run: dotnet test --project tests/HostForge.NativeAot.Tests -c Release --treenode-filter '/*/*/AvaloniaSmokeTests/*'

  build-hostlibs-windows:
    runs-on: windows-2025-vs2026
    env:
      CONAN_HOME: ${{ github.workspace }}/build/conan
    strategy:
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: arm64
            rid: win-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - uses: ./.github/actions/native-cache
        id: cache_hostlibs
        with:
          component: hostlibs
          version: 10.0.12
          rid: ${{ matrix.rid }}
          path: artifacts/hostlibs
          compiler-cache-size: 256M
          compiler: sccache

      - name: Install uv
        if: steps.cache_hostlibs.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.0.0

      - name: Install Task
        if: steps.cache_hostlibs.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-task

      - name: Build and deploy HostLibs
        shell: powershell
        if: steps.cache_hostlibs.outputs.cache-hit != 'true'
        run: python scripts/build-with-cache.py task build-hostlibs ARCH=${{ matrix.arch }} PGO=True JOBS=4

      - name: Upload hostlibs artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-hostlib-default-${{ matrix.rid }}
          path: artifacts\hostlibs
          if-no-files-found: error

  test-all-windows:
    runs-on: windows-2025-vs2026
    needs:
      - build-hostlibs-windows
      - build-skia-windows
      - build-angle-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Download HostLibs artifact (default win-x64)
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-hostlib-default-win-x64
          path: artifacts\hostlibs

      - name: Download SkiaSharp artifact (win-x64)
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-skia-3.119.4-win-x64
          path: artifacts\skiasharp

      - name: Download ANGLE artifact (win-x64)
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-angle-win-x64
          path: artifacts\angle

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Run matrix integration build
        shell: powershell
        run: task matrix

  link-avalonia-apphost-windows:
    runs-on: windows-2025-vs2026
    needs:
      - build-hostlibs-windows
      - build-skia-windows
      - build-angle-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Download HostLibs artifact (win-x64)
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-hostlib-default-win-x64
          path: artifacts\hostlibs

      - name: Download HostLibs artifact (win-arm64)
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-hostlib-default-win-arm64
          path: artifacts\hostlibs

      - name: Download SkiaSharp artifact (win-x64)
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-skia-3.119.4-win-x64
          path: artifacts\skiasharp

      - name: Download SkiaSharp artifact (win-arm64)
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-skia-3.119.4-win-arm64
          path: artifacts\skiasharp

      - name: Download ANGLE artifact (win-x64)
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-angle-win-x64
          path: artifacts\angle

      - name: Download ANGLE artifact (win-arm64)
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-angle-win-arm64
          path: artifacts\angle

      - name: Link Avalonia apphost templates for Windows
        shell: powershell
        run: task link-avalonia TARGET_OS=windows
      - name: Upload Windows Avalonia apphost artifact
        uses: actions/upload-artifact@v6
        with:
          name: avalonia-host-windows
          path: artifacts\avalonia-host
          if-no-files-found: error

      - name: Run Avalonia App Host package tests
        shell: powershell
        run: task avalonia-test

  build-sysroot-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Prepare the shared bionic cross rootfs
        uses: ./.github/actions/target-rootfs

  build-hostlibs-linux:
    runs-on: ubuntu-latest
    env:
      CONAN_HOME: ${{ github.workspace }}/build/conan
    needs:
      - build-sysroot-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Restore Linux sysroot
        id: restore_sysroot
        uses: ./.github/actions/target-rootfs

      - uses: ./.github/actions/native-cache
        id: cache_hostlibs
        with:
          component: hostlibs
          version: 10.0.12
          rid: linux-x64
          path: artifacts/hostlibs
          compiler-cache-size: 512M
          compiler: sccache

      - name: Build and deploy HostLibs
        if: steps.cache_hostlibs.outputs.cache-hit != 'true'
        run: python scripts/build-with-cache.py task build-hostlibs SYSROOT="${{ steps.restore_sysroot.outputs.sysroot-path }}" JOBS=4

      - name: Upload hostlibs artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-hostlib-default-linux-x64
          path: artifacts/hostlibs
          if-no-files-found: error

  test-all-linux:
    runs-on: ubuntu-latest
    needs:
      - build-sysroot-linux
      - build-hostlibs-linux
      - build-skia-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Restore Linux sysroot
        uses: ./.github/actions/target-rootfs

      - name: Install matrix dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang zlib1g-dev libfontconfig1-dev python-is-python3

      - name: Download HostLibs artifact (linux-x64)
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-hostlib-default-linux-x64
          path: artifacts/hostlibs

      - name: Download SkiaSharp artifact (linux-x64)
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-skia-3.119.4-linux-x64
          path: artifacts/skiasharp

      - name: Run matrix integration build
        run: task matrix

  link-avalonia-apphost-linux:
    runs-on: ubuntu-latest
    needs:
      - build-sysroot-linux
      - build-hostlibs-linux
      - build-skia-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Restore Linux sysroot
        id: restore_sysroot
        uses: ./.github/actions/target-rootfs

      - name: Download HostLibs artifact (linux-x64)
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-hostlib-default-linux-x64
          path: artifacts/hostlibs

      - name: Download SkiaSharp artifact (linux-x64)
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-skia-3.119.4-linux-x64
          path: artifacts/skiasharp

      - name: Link Avalonia apphost templates for Linux
        run: task link-avalonia TARGET_OS=linux SYSROOT="${{ steps.restore_sysroot.outputs.sysroot-path }}"
      - name: Run Avalonia App Host package tests
        run: task avalonia-test SYSROOT="${{ steps.restore_sysroot.outputs.sysroot-path }}"
      - name: Upload Linux Avalonia apphost artifact
        uses: actions/upload-artifact@v6
        with:
          name: avalonia-host-linux
          path: artifacts/avalonia-host
          if-no-files-found: error

  pack-avalonia-apphost:
    runs-on: windows-2025-vs2026
    needs:
      - link-avalonia-apphost-windows
      - link-avalonia-apphost-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Download Windows Avalonia apphost artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: avalonia-host-windows
          path: artifacts\avalonia-host

      - name: Download Linux Avalonia apphost artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: avalonia-host-linux
          path: artifacts\avalonia-host

      - name: Pack Avalonia apphost packages
        shell: powershell
        run: task pack-avalonia

      - name: Upload nuget packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-avalonia-apphost
          path: artifacts\packages\Release
          if-no-files-found: error

  cleanup-all:
    runs-on: ubuntu-latest
    needs:
      - test-skia-linux-cross
      - test-skia-windows-arm64
      - test-all
      - build-skia-macos
      - test-all-windows
      - test-all-linux
      - pack-avalonia-apphost
    permissions:
      actions: write
    steps:
      - name: Delete packaged build artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            native-skia-*
            native-rootfs-*
            native-angle-*
            avalonia-host-*
            nuget-native-skia-*
            nuget-native-avalonianative-*
