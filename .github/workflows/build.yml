      matrix:
        target: ${{ fromJSON(needs.plan-all.outputs.linux-musl-targets) }}
    env:
      SKIASHARP_VERSION: ${{ fromJSON(needs.plan-all.outputs.versions)[1] }}
      TARGET_RID: ${{ matrix.target.rid }}
