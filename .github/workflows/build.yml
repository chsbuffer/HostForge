        run: task avalonia-test SKIASHARP_VERSION=${{ env.SKIASHARP_VERSION }}
      - name: Upload Linux Avalonia apphost artifact
        uses: actions/upload-artifact@v7
        with:
          name: avalonia-host-skia4-linux
          path: artifacts/avalonia-host
          if-no-files-found: error

  link-avalonia-apphost-linux-musl:
    needs:
      - plan-all
      - build-hostlibs-linux
      - build-skia-linux-cross
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan-all.outputs.linux-musl-targets) }}
    env:
      SKIASHARP_VERSION: ${{ fromJSON(needs.plan-all.outputs.versions)[0] }}
      TARGET_RID: ${{ matrix.target.rid }}
      TARGET_ARCH: ${{ matrix.target.arch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Download HostLibs artifacts (all runtimes)
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-hostlib-default-*-${{ matrix.target.rid }}
          merge-multiple: true
          path: artifacts/hostlibs

      - name: Download SkiaSharp artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: native-skia-${{ env.SKIASHARP_VERSION }}-${{ matrix.target.rid }}
          path: artifacts/skiasharp

      # The container of the newest runtime links the LLVM bitcode of every runtime (see link-avalonia-apphost-linux).
      - name: Prepare the upstream link container
        uses: ./.github/actions/upstream-container
        with:
          stage: link
          rid: ${{ matrix.target.rid }}
          tag: hostforge-link

      - name: Link Avalonia apphost templates for Alpine
        run: >-
          docker run --rm -v "$PWD:/work" -v "$DOTNET_ROOT:$DOTNET_ROOT:ro" -e DOTNET_ROOT
          -e SKIASHARP_VERSION -e TARGET_RID -e TARGET_ARCH hostforge-link
          bash -c 'PATH="$DOTNET_ROOT:$PATH" task link-avalonia SKIASHARP_VERSION="$SKIASHARP_VERSION" TARGET_OS=linux-musl RID="$TARGET_RID" SYSROOT="/crossrootfs/$TARGET_ARCH"'

      - name: Restore ownership of container link outputs
        run: sudo chown -R "$(id -u):$(id -g)" artifacts

      - name: Upload Alpine Avalonia apphost artifact
        uses: actions/upload-artifact@v7
        with:
          name: avalonia-host-linux-musl-${{ matrix.target.arch }}
          path: artifacts/avalonia-host
          if-no-files-found: error

  test-avalonia-apphost-linux-musl:
    needs:
      - plan-all
      - link-avalonia-apphost-linux-musl
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan-all.outputs.linux-musl-targets) }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    env:
      SKIASHARP_VERSION: ${{ fromJSON(needs.plan-all.outputs.versions)[0] }}
      HOSTFORGE_NATIVE_RID: ${{ matrix.target.rid }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Download Alpine Avalonia apphost artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: avalonia-host-linux-musl-${{ matrix.target.arch }}
          path: artifacts/avalonia-host

      # The SDK image has the .NET 11 runtime; framework-dependent net10.0 consumers also need .NET 10.
      - name: Run Avalonia App Host package tests in native Alpine
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -e SkiaSharpVersion="$SKIASHARP_VERSION" -e HOSTFORGE_NATIVE_RID \
            mcr.microsoft.com/dotnet/sdk@sha256:52556c0fb9d0f609ae9aeab9efeeba96f4acc2f7038f7696f2235ccbdbb8e290 \
            sh -eu -c 'apk add --no-cache bash binutils fontconfig font-dejavu
              wget -qO /tmp/dotnet-install.sh https://dot.net/v1/dotnet-install.sh
              bash /tmp/dotnet-install.sh --channel 10.0 --runtime dotnet --install-dir /usr/share/dotnet
              dotnet test --project tests/HostForge.AvaloniaAppHost.Tests/HostForge.AvaloniaAppHost.Tests.csproj -c Release'

  link-avalonia-apphost-skia4-linux-musl:
    needs:
      - plan-all
