name: cleanup-pr-caches

# Caches saved by a pull request belong to refs/pull/<number>/merge, which only that pull request can restore.
# Deleting the caches of every pull request that is no longer open leaves the repository cache quota to the
# caches of main.
# Closing a pull request does not stop its running workflows, which can save caches after the closed event, so
# the daily run also deletes those.
# pull_request_target runs the workflow of the base branch with a token that can delete caches, also for pull
# requests from forks; it checks out nothing from the pull request.
on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "23 6 * * *"

permissions:
  actions: write
  pull-requests: read

# Runs that delete the same caches at the same time would fail on the caches the other one deleted.
concurrency:
  group: cleanup-pr-caches
  cancel-in-progress: false

jobs:
  delete-caches:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the caches of pull requests that are no longer open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          refs=$(gh cache list --limit 1000 --json ref \
            --jq '[.[].ref | select(test("^refs/pull/[0-9]+/merge$"))] | unique[]')
          open=$(gh pr list --state open --limit 1000 --json number --jq '.[].number')
          for ref in $refs; do
            number=${ref#refs/pull/}
            number=${number%/merge}
            if ! grep -qx "$number" <<< "$open"; then
              echo "Deleting the caches of $ref"
              gh cache delete --all --ref "$ref" --succeed-on-no-caches
            fi
          done
