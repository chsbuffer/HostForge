name: upstream

# Daily upstream check with a read-only token: the job summary lists newer upstream releases with the apply group
# that handles each, which the maintainer applies locally (task upstream-apply -- --group <group>) and opens as a
# pull request. The job fails on a newer .NET security release, an end-of-life .NET channel or a vulnerable
# pinned package, and when the .NET or advisory data cannot be read; the other sections only report.
# GitHub's Actions notifications, if enabled in that user's settings, go to the user who created the workflow,
# last changed its cron syntax or re-enabled it. GitHub disables the schedule of a public repository after 60
# days without repository activity.
on:
  schedule:
    # Off the top of the hour, when GitHub delays scheduled runs under load.
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/upstream.py check --fail-on-security
