version: "3"

# Commands receive environment values as assignments on the command line: a task's env: entry does not replace
# a variable that the caller's environment already sets.

vars:
  VERBOSITY: '{{.VERBOSITY | default "minimal"}}'
  JOBS: '{{.JOBS | default "12"}}'

tasks:
  default:
    desc: List available repository tasks
    silent: true
    cmds:
      - task --list

  build-hostlibs:
    desc: Build and deploy HostLibs static libraries (HOSTLIBS_VERSION=<runtime in native/hostlibs/versions.json>, Windows ARCH=x64|arm64 and PGO=True|False, Linux RID=<Linux RID> and SYSROOT=…)
    vars:
      ARCH: '{{.ARCH | default "x64"}}'
      PGO: '{{.PGO | default "True"}}'
      RID: '{{.RID | default ""}}'
      # build.sh runs in the Runtime checkout in Conan's cache, so a relative path is resolved against the repository root.
      SYSROOT: '{{with .SYSROOT | default .ROOTFS_DIR}}{{if osIsAbs .}}{{.}}{{else}}{{joinPath $.ROOT_DIR .}}{{end}}{{end}}'
      HOSTLIBS_VERSION:
        sh: '{{if .HOSTLIBS_VERSION}}echo {{.HOSTLIBS_VERSION}}{{else}}uv run python scripts/repo_versions.py --get hostlibs{{end}}'
    cmds:
      - task: _hostlibs-windows
        vars: {ARCH: "{{.ARCH}}", PGO: "{{.PGO}}", HOSTLIBS_VERSION: "{{.HOSTLIBS_VERSION}}"}
        platforms: [windows]
      - task: _hostlibs-linux
        vars: {RID: "{{.RID}}", SYSROOT: "{{.SYSROOT}}", PGO: "{{.PGO}}", HOSTLIBS_VERSION: "{{.HOSTLIBS_VERSION}}"}
        platforms: [linux]

  _hostlibs-windows:
    internal: true
    platforms: [windows]
    requires:
      vars:
        - HOSTLIBS_VERSION
    cmds:
      - uv run conan export native/hostlibs --version={{.HOSTLIBS_VERSION}}
      - >-
        uv run conan install --requires="hostlibs/{{.HOSTLIBS_VERSION}}" --build=missing --no-remote --envs-generation=false
        -pr:b=native/hostlibs/profiles/windows-{{.ARCH}}
        -pr:h=native/hostlibs/profiles/windows-{{.ARCH}}
        -o "hostlibs/*:pgo={{.PGO}}"
        -c tools.build:jobs={{.JOBS}}
        --deployer=native/hostlibs/deploy.py
        --deployer-folder=artifacts/hostlibs

  _hostlibs-linux:
    internal: true
    platforms: [linux]
    vars:
      TARGET_RID: '{{.RID | default "linux-x64"}}'
    requires:
      vars:
        - name: TARGET_RID
          enum: [linux-x64, linux-musl-x64, linux-musl-arm64]
        - HOSTLIBS_VERSION
    preconditions:
      - sh: '[ "{{.PGO}}" = True ]'
        msg: "Linux HostLibs take only PGO=True (case-sensitive), not PGO={{.PGO}}: like the official Linux runtime, they are always built with PGO"
    cmds:
      - uv run conan export native/hostlibs --version={{.HOSTLIBS_VERSION}}
      - >-
        ROOTFS_DIR="{{.SYSROOT}}" uv run conan install --requires="hostlibs/{{.HOSTLIBS_VERSION}}" --build=missing --no-remote --envs-generation=false
        -pr:b=native/hostlibs/profiles/linux-x64
        -pr:h=native/hostlibs/profiles/{{.TARGET_RID}}
        -c tools.build:jobs={{.JOBS}}
        --deployer=native/hostlibs/deploy.py
        --deployer-folder=artifacts/hostlibs

  build-skiasharp:
    desc: Build SkiaSharp + HarfBuzz (SKIASHARP_VERSION=<version in native/skiasharp/versions.json>, RID=<supported RID>, ARCH=x64|arm64, SYSROOT=…)
    vars:
      ARCH: '{{.ARCH | default "x64"}}'
      RID: '{{.RID | default ""}}'
      SKIASHARP_VERSION:
        sh: '{{if .SKIASHARP_VERSION}}echo {{.SKIASHARP_VERSION}}{{else}}uv run python scripts/repo_versions.py --get skiasharp{{end}}'
      # The recipe reads the sysroot in Conan's build folder, so a relative path is resolved against the repository root.
      SYSROOT: '{{with .SYSROOT | default .ROOTFS_DIR}}{{if osIsAbs .}}{{.}}{{else}}{{joinPath $.ROOT_DIR .}}{{end}}{{end}}'
    cmds:
      - task: _skiasharp-windows
        vars: {ARCH: "{{.ARCH}}", RID: "{{.RID}}", SKIASHARP_VERSION: "{{.SKIASHARP_VERSION}}"}
        platforms: [windows]
      - task: _skiasharp-linux
        vars: {ARCH: "{{.ARCH}}", RID: "{{.RID}}", SYSROOT: "{{.SYSROOT}}", SKIASHARP_VERSION: "{{.SKIASHARP_VERSION}}"}
        platforms: [linux]
      - task: _skiasharp-macos
        vars: {ARCH: "{{.ARCH}}", RID: "{{.RID}}", SKIASHARP_VERSION: "{{.SKIASHARP_VERSION}}"}
        platforms: [darwin]

  _skiasharp-macos:
    internal: true
    platforms: [darwin]
    vars:
      TARGET_ARCH: '{{if .RID}}{{trimPrefix "osx-" .RID}}{{else}}{{.ARCH}}{{end}}'
      HOST_ARCH: '{{if eq ARCH "arm64"}}arm64{{else}}x64{{end}}'
      CLANG_VERSION:
        sh: clang -dumpversion
    requires:
      vars:
        - name: TARGET_ARCH
          enum: [x64, arm64]
        - SKIASHARP_VERSION
    cmds:
      - uv run conan export native/skiasharp --version={{.SKIASHARP_VERSION}}
      - >-
        uv run conan install --requires="skiasharp/{{.SKIASHARP_VERSION}}" --build=missing --no-remote --envs-generation=false
        -pr:b=native/skiasharp/profiles/macos-{{.HOST_ARCH}}
        -pr:h=native/skiasharp/profiles/macos-{{.TARGET_ARCH}}
        -s:b compiler.version={{index (splitList "." .CLANG_VERSION) 0}}
        -s:h compiler.version={{index (splitList "." .CLANG_VERSION) 0}}
        -s:h compiler.cppstd={{if lt (atoi (first (splitList "." .SKIASHARP_VERSION))) 4}}17{{else}}20{{end}}
        -c tools.build:jobs={{min (atoi .JOBS) 4}}
        --deployer=native/skiasharp/deploy.py
        --deployer-folder=artifacts/skiasharp

  _skiasharp-windows:
    internal: true
    platforms: [windows]
    vars:
      TARGET_ARCH: '{{if .RID}}{{trimPrefix "win-" .RID}}{{else}}{{.ARCH}}{{end}}'
    requires:
      vars:
        - name: TARGET_ARCH
          enum: [x64, arm64]
        - SKIASHARP_VERSION
    cmds:
      - uv run conan export native/skiasharp --version={{.SKIASHARP_VERSION}}
      - >-
        uv run conan install --requires="skiasharp/{{.SKIASHARP_VERSION}}" --build=missing --no-remote --envs-generation=false
        -pr:b=native/skiasharp/profiles/windows-x64
        -pr:h=native/skiasharp/profiles/windows-{{.TARGET_ARCH}}
        -s:h compiler.cppstd={{if lt (atoi (first (splitList "." .SKIASHARP_VERSION))) 4}}17{{else}}20{{end}}
        -c tools.build:jobs={{.JOBS}}
        --deployer=native/skiasharp/deploy.py
        --deployer-folder=artifacts/skiasharp

  _skiasharp-linux:
    internal: true
    platforms: [linux]
    vars:
      TARGET_RID: '{{.RID | default (printf "linux-%s" .ARCH)}}'
      CLANG_VERSION:
        sh: ${CC:-clang} -dumpversion
    requires:
      vars:
        - name: TARGET_RID
          enum: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64]
        - SKIASHARP_VERSION
    cmds:
      - uv run conan export native/skiasharp --version={{.SKIASHARP_VERSION}}
      - >-
        ROOTFS_DIR="{{.SYSROOT}}" CC=${CC:-clang} CXX=${CXX:-clang++} AR=${AR:-llvm-ar} uv run conan install --requires="skiasharp/{{.SKIASHARP_VERSION}}" --build=missing --no-remote --envs-generation=false
        -pr:b=native/skiasharp/profiles/linux-x64
        -pr:h=native/skiasharp/profiles/{{.TARGET_RID}}
        -s:h compiler.version={{first (splitList "." .CLANG_VERSION)}}
        -s:h compiler.cppstd={{if lt (atoi (first (splitList "." .SKIASHARP_VERSION))) 4}}17{{else}}20{{end}}
        -s:h compiler.libcxx={{if lt (atoi (first (splitList "." .SKIASHARP_VERSION))) 4}}libstdc++11{{else}}libc++{{end}}
        -c tools.build:jobs={{.JOBS}}
        -c tools.system.package_manager:mode=install
        -c tools.system.package_manager:sudo=True
        --deployer=native/skiasharp/deploy.py
        --deployer-folder=artifacts/skiasharp

  build-angle:
    desc: Build and deploy ANGLE static libraries (Windows only, ARCH=x64|arm64)
    platforms: [windows]
    vars:
      ARCH: '{{.ARCH | default "x64"}}'
      ANGLE_VERSION:
        sh: uv run python scripts/repo_versions.py --get angle
    cmds:
      - uv run conan export native/angle
      - >-
        uv run conan install --requires="angle/{{.ANGLE_VERSION}}" --build=missing --no-remote --envs-generation=false
        -pr:b=native/angle/profiles/windows-{{.ARCH}}
        -pr:h=native/angle/profiles/windows-{{.ARCH}}
        -c tools.build:jobs={{.JOBS}}
        --deployer=native/angle/deploy.py
        --deployer-folder=artifacts/angle

  build-avalonianative:
    desc: Build and deploy AvaloniaNative (macOS, RID=osx-x64|osx-arm64, AVALONIA_VERSION=<version in native/avalonianative/conandata.yml>)
    platforms: [darwin]
    vars:
      RID: '{{.RID | default "osx-arm64"}}'
      BUILD_ARCH:
        sh: uname -m
      BUILD_RID: '{{if eq .BUILD_ARCH "arm64"}}osx-arm64{{else}}osx-x64{{end}}'
      AVALONIA_VERSION:
        sh: '{{if .AVALONIA_VERSION}}echo {{.AVALONIA_VERSION}}{{else}}uv run python scripts/repo_versions.py --get avalonia-native{{end}}'
    requires:
      vars:
        - name: RID
          enum: [osx-x64, osx-arm64]
    cmds:
      - uv run conan export native/avalonianative --version={{.AVALONIA_VERSION}}
      - >-
        uv run conan install --requires="avalonianative/{{.AVALONIA_VERSION}}" --build=missing --no-remote --envs-generation=false
        -pr:b=native/avalonianative/profiles/{{.BUILD_RID}}
        -pr:h=native/avalonianative/profiles/{{.RID}}
        --deployer=native/avalonianative/deploy.py
        --deployer-folder=artifacts/avalonianative

  pack-avalonianative:
    desc: Pack one AvaloniaNative RID (RID=osx-x64|osx-arm64, AVALONIA_VERSION defaults to AvaloniaNativeVersion in Directory.Build.props)
    requires:
      vars:
        - name: RID
          enum: [osx-x64, osx-arm64]
    cmds:
      - >-
        dotnet pack src/package-avalonia-native-static/Avalonia.Native.Static.Rid.csproj -c Release
        -p:AvaloniaNativeRid={{.RID}} {{if .AVALONIA_VERSION}}-p:AvaloniaNativeVersion={{.AVALONIA_VERSION}}{{end}}
        -v:{{.VERBOSITY}}

  pack-avalonianative-meta:
    desc: Pack the AvaloniaNative meta package (requires both RID packages)
    cmds:
      - >-
        dotnet pack src/package-static-graphics/StaticGraphics.csproj -c Release -p:StaticGraphicsComponent=Avalonia.Native
        {{if .AVALONIA_VERSION}}-p:AvaloniaNativeVersion={{.AVALONIA_VERSION}}{{end}}
        -v:{{.VERBOSITY}}

  test-avalonianative:
    desc: Test AvaloniaNative integration (macOS execution requires a packed current-RID payload)
    cmds:
      - dotnet test --project tests/HostForge.AvaloniaNative.Tests/HostForge.AvaloniaNative.Tests.csproj -c Release -v:{{.VERBOSITY}}

  # ── Integration tests & packaging ─────────────────────────────

  matrix:
    desc: Run the Static AppHost and NativeAOT integration matrices
    vars:
      SKIP_EXE_RUN: '{{.SKIP_EXE_RUN | default .HOSTFORGE_MATRIX_SKIP_EXE_RUN | default "false"}}'
      NO_CLEAN: '{{.NO_CLEAN | default .HOSTFORGE_MATRIX_NO_CLEAN | default "false"}}'
    cmds:
      - >-
        HOSTFORGE_MATRIX_SKIP_EXE_RUN={{.SKIP_EXE_RUN}} HOSTFORGE_MATRIX_NO_CLEAN={{.NO_CLEAN}}
        dotnet test
        --project tests/HostForge.StaticAppHost.Tests/HostForge.StaticAppHost.Tests.csproj
        -c Release
        -v:{{.VERBOSITY}}
      - task: matrix-nativeaot

  link-avalonia:
    desc: Link Avalonia apphost templates for one target OS (RID=<one RID of TARGET_OS>, SYSROOT=…)
    requires:
      vars:
        - name: TARGET_OS
          enum: [windows, linux, linux-musl]
    cmds:
      - >-
        dotnet msbuild src/package-avalonia-apphost/AvaloniaAppHost.Link.proj
        /t:LinkAvaloniaHosts
        -p:AvaloniaAppHostTarget={{.TARGET_OS}}
        {{if .RID}}-p:AvaloniaHostRids={{.RID}}{{end}}
        {{if .SKIASHARP_VERSION}}-p:SkiaSharpVersion={{.SKIASHARP_VERSION}}{{end}}
        -p:HostLibsFlavor=default
        {{if .SYSROOT}}-p:Sysroot="{{.SYSROOT}}"{{end}}
        -v:{{.VERBOSITY}}

  avalonia-test:
    desc: Run the Avalonia AppHost integration tests
    cmds:
      - >-
        {{if .SKIASHARP_VERSION}}SkiaSharpVersion={{.SKIASHARP_VERSION}}{{end}}
        dotnet test
        --project tests/HostForge.AvaloniaAppHost.Tests/HostForge.AvaloniaAppHost.Tests.csproj
        -c Release
        -v:{{.VERBOSITY}}

  pack-avalonia-rid:
    desc: Pack one Avalonia AppHost RID package (requires linked templates)
    requires:
      vars:
        - name: RID
          enum: [win-x64, win-arm64, linux-x64, linux-musl-x64, linux-musl-arm64]
    cmds:
      - >-
        dotnet pack src/package-avalonia-apphost/AvaloniaAppHost.Rid.csproj
        -c Release
        -p:AvaloniaHostRid={{.RID}}
        {{if .SKIASHARP_VERSION}}-p:SkiaSharpVersion={{.SKIASHARP_VERSION}}{{end}}
        -v:{{.VERBOSITY}}

  pack-avalonia-build:
    desc: Pack the Avalonia AppHost Build package
    cmds:
      - >-
        dotnet pack src/package-avalonia-apphost/AvaloniaAppHost.Build.csproj
        -c Release
        {{if .SKIASHARP_VERSION}}-p:SkiaSharpVersion={{.SKIASHARP_VERSION}}{{end}}
        -v:{{.VERBOSITY}}

  pack-avalonia-meta:
    desc: Pack the meta package (requires all RID + Build packages already packed)
    cmds:
      - >-
        dotnet pack src/package-avalonia-apphost/AvaloniaAppHost.csproj
        -c Release
        {{if .SKIASHARP_VERSION}}-p:SkiaSharpVersion={{.SKIASHARP_VERSION}}{{end}}
        -v:{{.VERBOSITY}}

  pack-avalonia:
    desc: Pack all Avalonia AppHost packages (requires linked templates for all RIDs)
    cmds:
      - task: pack-avalonia-rid
        vars: {RID: win-x64, SKIASHARP_VERSION: '{{.SKIASHARP_VERSION}}'}
      - task: pack-avalonia-rid
        vars: {RID: win-arm64, SKIASHARP_VERSION: '{{.SKIASHARP_VERSION}}'}
      - task: pack-avalonia-rid
        vars: {RID: linux-x64, SKIASHARP_VERSION: '{{.SKIASHARP_VERSION}}'}
      - task: pack-avalonia-rid
        vars: {RID: linux-musl-x64, SKIASHARP_VERSION: '{{.SKIASHARP_VERSION}}'}
      - task: pack-avalonia-rid
        vars: {RID: linux-musl-arm64, SKIASHARP_VERSION: '{{.SKIASHARP_VERSION}}'}
      - task: pack-avalonia-build
        vars: {SKIASHARP_VERSION: '{{.SKIASHARP_VERSION}}'}
      - task: pack-avalonia-meta
        vars: {SKIASHARP_VERSION: '{{.SKIASHARP_VERSION}}'}

  pack-static-apphost:
    desc: Pack the generic Static AppHost package for one runtime line (TFM=<one of HostForgeTargetFrameworks>, default HostLibsTargetFramework)
    vars:
      RID: '{{.RID | default "win-x64"}}'
    requires:
      vars:
        - name: RID
          enum: [win-x64]
    cmds:
      - >-
        dotnet pack src/package-apphost-static/AppHostStatic.csproj
        -p:StaticAppHostRid={{.RID}}
        {{if .TFM}}-p:HostLibsTargetFramework={{.TFM}}{{end}}
        -p:HostLibsFlavor=no-pgo
        -v:{{.VERBOSITY}}

  pack-skia-static:
    desc: Pack the SkiaSharp static-link inputs
    vars:
      RID: '{{.RID | default "win-x64"}}'
    requires:
      vars:
        - name: RID
          enum: [win-x64, win-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-x64, osx-arm64]
    cmds:
      - >-
        dotnet pack src/package-skiasharp-static/SkiaSharp.Static.csproj
        -c Release
        -p:AvaloniaHostRid={{.RID}}
        {{if .SKIASHARP_VERSION}}-p:SkiaSharpVersion={{.SKIASHARP_VERSION}}{{end}}
        -v:{{.VERBOSITY}}

  pack-angle-static:
    desc: Pack the ANGLE static-link inputs
    vars:
      RID: '{{.RID | default "win-x64"}}'
    requires:
      vars:
        - name: RID
          enum: [win-x64, win-arm64]
    cmds:
      - >-
        dotnet pack src/package-angle-static/Angle.Static.csproj
        -c Release
        -p:AngleHostRid={{.RID}}
        -v:{{.VERBOSITY}}

  pack-graphics-meta:
    desc: Pack a static graphics meta package (COMPONENT=SkiaSharp|Angle|Avalonia.Native)
    requires:
      vars:
        - name: COMPONENT
          enum: [SkiaSharp, Angle, Avalonia.Native]
    cmds:
      - >-
        dotnet pack src/package-static-graphics/StaticGraphics.csproj -c Release
        -p:StaticGraphicsComponent={{.COMPONENT}} {{if .SKIASHARP_VERSION}}-p:SkiaSharpVersion={{.SKIASHARP_VERSION}}{{end}}
        -v:{{.VERBOSITY}}

  matrix-nativeaot:
    desc: Pack the static graphics packages of the .NET SDK's RID and publish and run the NativeAOT matrix with them (SKIASHARP_VERSION=<version in native/skiasharp/versions.json>)
    vars:
      SKIASHARP_VERSION:
        sh: '{{if .SKIASHARP_VERSION}}echo {{.SKIASHARP_VERSION}}{{else}}uv run python scripts/repo_versions.py --get skiasharp{{end}}'
      # The tests run on the SDK's runtime. Task's ARCH is the architecture of the Task binary and tells no libc apart.
      RID:
        sh: dotnet msbuild src/package-skiasharp-static/SkiaSharp.Static.csproj -getProperty:NETCoreSdkPortableRuntimeIdentifier
    cmds:
      - task: pack-skia-static
        vars: {RID: '{{.RID}}', SKIASHARP_VERSION: '{{.SKIASHARP_VERSION}}'}
      - task: _matrix-nativeaot-windows
        vars: {RID: '{{.RID}}'}
      - >-
        HOSTFORGE_NATIVE_RID={{.RID}} HOSTFORGE_SKIA_VERSION={{.SKIASHARP_VERSION}}
        dotnet test
        --project tests/HostForge.NativeAot.Tests/HostForge.NativeAot.Tests.csproj
        -c Release
        -v:{{.VERBOSITY}}

  # Task checks the required variables of a called task before the platforms of the call.
  _matrix-nativeaot-windows:
    internal: true
    platforms: [windows]
    cmds:
      - task: pack-angle-static
        vars: {RID: '{{.RID}}'}

  # ── Upstream tracking ─────────────────────────────────────────

  upstream-check:
    desc: Report newer upstream releases and pending security fixes (read-only; -- --json, -- --fail-on-security)
    cmds:
      - uv run --no-project python scripts/upstream.py check {{.CLI_ARGS}}

  upstream-apply:
    desc: Update the files of one upstream group and the package lock (-- --group <name>, default inputs; -- --dry-run to preview)
    cmds:
      - uv run --no-project python scripts/upstream.py apply {{.CLI_ARGS}}

  upstream-lock:
    desc: Write the current package versions to package-inputs.lock.json (-- --check to verify)
    cmds:
      - uv run --no-project python scripts/upstream.py lock {{.CLI_ARGS}}
