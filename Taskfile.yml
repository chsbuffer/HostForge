version: "3"

vars:
  VERBOSITY: '{{.VERBOSITY | default "minimal"}}'
  JOBS: '{{.JOBS | default "12"}}'

tasks:
  default:
    desc: List available repository tasks
    silent: true
    cmds:
      - task --list

  build-hostlibs:
    desc: Build and deploy HostLibs static libraries (ARCH=x64|arm64, PGO=true|false, SYSROOT=…)
    vars:
      ARCH: '{{.ARCH | default "x64"}}'
      PGO: '{{.PGO | default "True"}}'
      SYSROOT: '{{.SYSROOT | default ""}}'
    cmds:
      - task: _hostlibs-windows
        vars: {ARCH: "{{.ARCH}}", PGO: "{{.PGO}}"}
        platforms: [windows]
      - task: _hostlibs-linux
        vars: {SYSROOT: "{{.SYSROOT}}"}
        platforms: [linux]

  _hostlibs-windows:
    internal: true
    platforms: [windows]
    vars:
      FLAVOR: '{{if eq .PGO "True"}}default{{else}}no-pgo{{end}}'
    cmds:
      - uv run conan export native/hostlibs
      - >-
        uv run conan install --requires="hostlibs/[>=0.0.0]" --build=missing --no-remote --envs-generation=false
        -pr:b=native/hostlibs/profiles/windows-{{.ARCH}}
        -pr:h=native/hostlibs/profiles/windows-{{.ARCH}}
        -o "hostlibs/*:pgo={{.PGO}}"
        -c tools.build:jobs={{.JOBS}}
        --deployer=native/hostlibs/deploy.py
        --deployer-folder=artifacts/hostlibs

  _hostlibs-linux:
    internal: true
    platforms: [linux]
    env:
      ROOTFS_DIR: '{{.SYSROOT}}'
    cmds:
      - uv run conan export native/hostlibs
      - >-
        uv run conan install --requires="hostlibs/[>=0.0.0]" --build=missing --no-remote --envs-generation=false
        -pr:b=native/hostlibs/profiles/linux-x64
        -pr:h=native/hostlibs/profiles/linux-x64
        -c tools.build:jobs={{.JOBS}}
        -c tools.system.package_manager:mode=install
        -c tools.system.package_manager:sudo=True
        --deployer=native/hostlibs/deploy.py
        --deployer-folder=artifacts/hostlibs

  build-skiasharp:
    desc: Build SkiaSharp + HarfBuzz (SKIASHARP_VERSION=3.119.4|4.153.1, RID=<supported RID>, ARCH=x64|arm64, SYSROOT=…)
    vars:
      ARCH: '{{.ARCH | default "x64"}}'
      RID: '{{.RID | default ""}}'
      SKIASHARP_VERSION: '{{.SKIASHARP_VERSION | default "3.119.4"}}'
      SYSROOT: '{{.SYSROOT | default .ROOTFS_DIR | default ""}}'
    cmds:
      - task: _skiasharp-windows
        vars: {ARCH: "{{.ARCH}}", RID: "{{.RID}}", SKIASHARP_VERSION: "{{.SKIASHARP_VERSION}}"}
        platforms: [windows]
      - task: _skiasharp-linux
        vars: {ARCH: "{{.ARCH}}", RID: "{{.RID}}", SYSROOT: "{{.SYSROOT}}", SKIASHARP_VERSION: "{{.SKIASHARP_VERSION}}"}
        platforms: [linux]
      - task: _skiasharp-macos
        vars: {ARCH: "{{.ARCH}}", RID: "{{.RID}}", SKIASHARP_VERSION: "{{.SKIASHARP_VERSION}}"}
        platforms: [darwin]

  _skiasharp-macos:
    internal: true
    platforms: [darwin]
    vars:
      TARGET_ARCH: '{{if .RID}}{{trimPrefix "osx-" .RID}}{{else}}{{.ARCH}}{{end}}'
      HOST_ARCH: '{{if eq ARCH "arm64"}}arm64{{else}}x64{{end}}'
      CLANG_VERSION:
        sh: clang -dumpversion
    requires:
      vars:
        - name: TARGET_ARCH
          enum: [x64, arm64]
        - name: SKIASHARP_VERSION
          enum: ["3.119.4", "4.153.1"]
    cmds:
      - uv run conan export native/skiasharp --version={{.SKIASHARP_VERSION}}
      - >-
        uv run conan install --requires="skiasharp/{{.SKIASHARP_VERSION}}" --build=missing --no-remote --envs-generation=false
        -pr:b=native/skiasharp/profiles/macos-{{.HOST_ARCH}}
        -pr:h=native/skiasharp/profiles/macos-{{.TARGET_ARCH}}
        -s:b compiler.version={{index (splitList "." .CLANG_VERSION) 0}}
        -s:h compiler.version={{index (splitList "." .CLANG_VERSION) 0}}
        -s:h compiler.cppstd={{if eq .SKIASHARP_VERSION "3.119.4"}}17{{else}}20{{end}}
        -c tools.build:jobs={{min (atoi .JOBS) 4}}
        --deployer=native/skiasharp/deploy.py
        --deployer-folder=artifacts/skiasharp

  _skiasharp-windows:
    internal: true
    platforms: [windows]
    vars:
      TARGET_ARCH: '{{if .RID}}{{trimPrefix "win-" .RID}}{{else}}{{.ARCH}}{{end}}'
    requires:
      vars:
        - name: TARGET_ARCH
          enum: [x64, arm64]
        - name: SKIASHARP_VERSION
          enum: ["3.119.4", "4.153.1"]
    cmds:
      - uv run conan export native/skiasharp --version={{.SKIASHARP_VERSION}}
      - >-
        uv run conan install --requires="skiasharp/{{.SKIASHARP_VERSION}}" --build=missing --no-remote --envs-generation=false
        -pr:b=native/skiasharp/profiles/windows-x64
        -pr:h=native/skiasharp/profiles/windows-{{.TARGET_ARCH}}
        -s:h compiler.cppstd={{if eq .SKIASHARP_VERSION "3.119.4"}}17{{else}}20{{end}}
        -c tools.build:jobs={{.JOBS}}
        --deployer=native/skiasharp/deploy.py
        --deployer-folder=artifacts/skiasharp

  _skiasharp-linux:
    internal: true
    platforms: [linux]
    vars:
      TARGET_RID: '{{.RID | default (printf "linux-%s" .ARCH)}}'
      CLANG_VERSION:
        sh: clang -dumpversion
    requires:
      vars:
        - name: TARGET_RID
          enum: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64]
        - name: SKIASHARP_VERSION
          enum: ["3.119.4", "4.153.1"]
    env:
      ROOTFS_DIR: '{{.SYSROOT}}'
    cmds:
      - uv run conan export native/skiasharp --version={{.SKIASHARP_VERSION}}
      - >-
        CC=clang CXX=clang++ AR=llvm-ar uv run conan install --requires="skiasharp/{{.SKIASHARP_VERSION}}" --build=missing --no-remote --envs-generation=false
        -pr:b=native/skiasharp/profiles/linux-x64
        -pr:h=native/skiasharp/profiles/{{.TARGET_RID}}
        -s:h compiler.version={{first (splitList "." .CLANG_VERSION)}}
        -s:h compiler.cppstd={{if eq .SKIASHARP_VERSION "3.119.4"}}17{{else}}20{{end}}
        -s:h compiler.libcxx={{if eq .SKIASHARP_VERSION "3.119.4"}}libstdc++11{{else}}libc++{{end}}
        -c tools.build:jobs={{.JOBS}}
        -c tools.system.package_manager:mode=install
        -c tools.system.package_manager:sudo=True
        --deployer=native/skiasharp/deploy.py
        --deployer-folder=artifacts/skiasharp

  build-angle:
    desc: Build and deploy ANGLE static libraries (Windows only, ARCH=x64|arm64)
    platforms: [windows]
    vars:
      ARCH: '{{.ARCH | default "x64"}}'
    cmds:
      - uv run conan export native/angle
      - >-
        uv run conan install --requires="angle/[>=0.0.0]" --build=missing --no-remote --envs-generation=false
        -pr:b=native/angle/profiles/windows-{{.ARCH}}
        -pr:h=native/angle/profiles/windows-{{.ARCH}}
        -c tools.build:jobs={{.JOBS}}
        --deployer=native/angle/deploy.py
        --deployer-folder=artifacts/angle

  build-avalonianative:
    desc: Build and deploy AvaloniaNative (macOS, RID=osx-x64|osx-arm64, AVALONIA_VERSION=12.1.3)
    platforms: [darwin]
    vars:
      RID: '{{.RID | default "osx-arm64"}}'
      BUILD_ARCH:
        sh: uname -m
      BUILD_RID: '{{if eq .BUILD_ARCH "arm64"}}osx-arm64{{else}}osx-x64{{end}}'
      AVALONIA_VERSION: '{{.AVALONIA_VERSION | default "12.1.3"}}'
    requires:
      vars:
        - name: RID
          enum: [osx-x64, osx-arm64]
    cmds:
      - uv run conan export native/avalonianative --version={{.AVALONIA_VERSION}}
      - >-
        uv run conan install --requires="avalonianative/{{.AVALONIA_VERSION}}" --build=missing --no-remote --envs-generation=false
        -pr:b=native/avalonianative/profiles/{{.BUILD_RID}}
        -pr:h=native/avalonianative/profiles/{{.RID}}
        --deployer=native/avalonianative/deploy.py
        --deployer-folder=artifacts/avalonianative

  pack-avalonianative:
    desc: Pack one AvaloniaNative RID (RID=osx-x64|osx-arm64, AVALONIA_VERSION=12.1.3, PACKAGING_REVISION=0)
    vars:
      AVALONIA_VERSION: '{{.AVALONIA_VERSION | default "12.1.3"}}'
      PACKAGING_REVISION: '{{.PACKAGING_REVISION | default "0"}}'
    requires:
      vars:
        - name: RID
          enum: [osx-x64, osx-arm64]
    cmds:
      - >-
        dotnet pack src/package-avalonia-native-static/Avalonia.Native.Static.Rid.csproj -c Release
        -p:AvaloniaNativeRid={{.RID}} -p:AvaloniaNativeVersion={{.AVALONIA_VERSION}}
        -p:PackagingRevision={{.PACKAGING_REVISION}} -v:{{.VERBOSITY}}

  pack-avalonianative-meta:
    desc: Pack the AvaloniaNative meta package (requires both RID packages)
    vars:
      AVALONIA_VERSION: '{{.AVALONIA_VERSION | default "12.1.3"}}'
      PACKAGING_REVISION: '{{.PACKAGING_REVISION | default "0"}}'
    cmds:
      - >-
        dotnet pack src/package-static-graphics/StaticGraphics.csproj -c Release -p:StaticGraphicsComponent=Avalonia.Native
        -p:AvaloniaNativeVersion={{.AVALONIA_VERSION}} -p:PackagingRevision={{.PACKAGING_REVISION}}
        -v:{{.VERBOSITY}}

  test-avalonianative:
    desc: Test AvaloniaNative integration (macOS execution requires a packed current-RID payload)
    cmds:
      - dotnet test --project tests/HostForge.AvaloniaNative.Tests/HostForge.AvaloniaNative.Tests.csproj -c Release -v:{{.VERBOSITY}}

  # ── Integration tests & packaging ─────────────────────────────

  matrix:
    desc: Run the Static AppHost and NativeAOT integration matrices
    vars:
      SKIP_EXE_RUN: '{{.SKIP_EXE_RUN | default .HOSTFORGE_MATRIX_SKIP_EXE_RUN | default "false"}}'
      NO_CLEAN: '{{.NO_CLEAN | default .HOSTFORGE_MATRIX_NO_CLEAN | default "false"}}'
    env:
      HOSTFORGE_MATRIX_SKIP_EXE_RUN: "{{.SKIP_EXE_RUN}}"
      HOSTFORGE_MATRIX_NO_CLEAN: "{{.NO_CLEAN}}"
    cmds:
      - >-
        dotnet test
        --project tests/HostForge.StaticAppHost.Tests/HostForge.StaticAppHost.Tests.csproj
        -c Release
        -v:{{.VERBOSITY}}
      - task: matrix-nativeaot

  link-avalonia:
    desc: Link Avalonia apphost templates for one target OS
    requires:
      vars:
        - name: TARGET_OS
          enum: [windows, linux]
    cmds:
      - >-
        dotnet msbuild src/package-avalonia-apphost/AvaloniaAppHost.Link.proj
        /t:LinkAvaloniaHosts
        -p:AvaloniaAppHostTarget={{.TARGET_OS}}
        -p:HostLibsFlavor=default
        {{if .SYSROOT}}-p:Sysroot="{{.SYSROOT}}"{{end}}
        -v:{{.VERBOSITY}}

  avalonia-test:
    desc: Run the Avalonia AppHost integration tests
    vars:
      SYSROOT: '{{.SYSROOT | default .ROOTFS_DIR | default ""}}'
    env:
      ROOTFS_DIR: "{{.SYSROOT}}"
    cmds:
      - >-
        dotnet test
        --project tests/HostForge.AvaloniaAppHost.Tests/HostForge.AvaloniaAppHost.Tests.csproj
        -c Release
        -v:{{.VERBOSITY}}

  pack-avalonia-rid:
    desc: Pack one Avalonia AppHost RID package (requires linked templates)
    requires:
      vars:
        - name: RID
          enum: [win-x64, win-arm64, linux-x64]
    cmds:
      - >-
        dotnet pack src/package-avalonia-apphost/AvaloniaAppHost.Rid.csproj
        -c Release
        -p:AvaloniaHostRid={{.RID}}
        -v:{{.VERBOSITY}}

  pack-avalonia-build:
    desc: Pack the Avalonia AppHost Build package
    cmds:
      - >-
        dotnet pack src/package-avalonia-apphost/AvaloniaAppHost.Build.csproj
        -c Release
        -v:{{.VERBOSITY}}

  pack-avalonia-meta:
    desc: Pack the meta package (requires all RID + Build packages already packed)
    cmds:
      - >-
        dotnet pack src/package-avalonia-apphost/AvaloniaAppHost.csproj
        -c Release
        -v:{{.VERBOSITY}}

  pack-avalonia:
    desc: Pack all Avalonia AppHost packages (requires linked templates for all RIDs)
    cmds:
      - task: pack-avalonia-rid
        vars: {RID: win-x64}
      - task: pack-avalonia-rid
        vars: {RID: win-arm64}
      - task: pack-avalonia-rid
        vars: {RID: linux-x64}
      - task: pack-avalonia-build
      - task: pack-avalonia-meta

  pack-static-apphost:
    desc: Pack the generic Static AppHost package
    vars:
      RID: '{{.RID | default "win-x64"}}'
    requires:
      vars:
        - name: RID
          enum: [win-x64]
    cmds:
      - >-
        dotnet pack src/package-apphost-static/AppHostStatic.csproj
        -p:StaticAppHostRid={{.RID}}
        -p:HostLibsFlavor=no-pgo
        -v:{{.VERBOSITY}}

  pack-skia-static:
    desc: Pack the SkiaSharp static-link inputs
    vars:
      RID: '{{.RID | default "win-x64"}}'
      SKIASHARP_VERSION: '{{.SKIASHARP_VERSION | default "3.119.4"}}'
    requires:
      vars:
        - name: RID
          enum: [win-x64, win-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-x64, osx-arm64]
    cmds:
      - >-
        dotnet pack src/package-skiasharp-static/SkiaSharp.Static.csproj
        -c Release
        -p:AvaloniaHostRid={{.RID}}
        -p:SkiaSharpVersion={{.SKIASHARP_VERSION}}
        -v:{{.VERBOSITY}}

  pack-angle-static:
    desc: Pack the ANGLE static-link inputs
    vars:
      RID: '{{.RID | default "win-x64"}}'
    requires:
      vars:
        - name: RID
          enum: [win-x64, win-arm64]
    cmds:
      - >-
        dotnet pack src/package-angle-static/Angle.Static.csproj
        -c Release
        -p:AngleHostRid={{.RID}}
        -v:{{.VERBOSITY}}

  pack-graphics-meta:
    desc: Pack a static graphics meta package (COMPONENT=SkiaSharp|Angle|Avalonia.Native)
    requires:
      vars:
        - name: COMPONENT
          enum: [SkiaSharp, Angle, Avalonia.Native]
    vars:
      SKIASHARP_VERSION: '{{.SKIASHARP_VERSION | default "3.119.4"}}'
    cmds:
      - >-
        dotnet pack src/package-static-graphics/StaticGraphics.csproj -c Release
        -p:StaticGraphicsComponent={{.COMPONENT}} -p:SkiaSharpVersion={{.SKIASHARP_VERSION}}
        -v:{{.VERBOSITY}}

  matrix-nativeaot:
    desc: Publish and run the NativeAOT static graphics matrix on the current OS
    cmds:
      - task: _matrix-nativeaot-windows
      - task: _matrix-nativeaot-linux
      - task: _matrix-nativeaot-macos
      - >-
        dotnet test
        --project tests/HostForge.NativeAot.Tests/HostForge.NativeAot.Tests.csproj
        -c Release
        -v:{{.VERBOSITY}}

  _matrix-nativeaot-windows:
    internal: true
    platforms: [windows]
    cmds:
      - task: pack-skia-static
        vars: {RID: win-x64}
      - task: pack-angle-static

  _matrix-nativeaot-linux:
    internal: true
    platforms: [linux]
    cmds:
      - task: pack-skia-static
        vars: {RID: linux-x64}

  _matrix-nativeaot-macos:
    internal: true
    platforms: [darwin]
    cmds:
      - task: pack-skia-static
        vars: {RID: 'osx-{{if eq ARCH "arm64"}}arm64{{else}}x64{{end}}'}
